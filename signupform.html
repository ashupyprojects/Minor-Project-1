<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Bharat Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="top-brand">
    <img src="icons/emblem.png" alt="Emblem" class="top-emblem">
    <a href="/index.html">
      <img src="icons/websitelogo.png" alt="Bharat Portal" class="top-logo">
    </a>
  </div>

  <div class="signup-card">
    <h1 class="signup-title">
      Sign up for <span>Bharat Portal</span>
    </h1>

    <form id="signup-form">

      <input
        type="text"
        name="name"
        class="input-field"
        placeholder="Full Name*"
        required
      >

      <input
        type="date"
        name="dob"
        class="input-field"
        placeholder="Date of Birth*"
        required
      >

      <input
        type="text"
        name="state"
        class="input-field"
        placeholder="State*"
        required
      >

      <select name="category" class="input-field" required>
        <option value="" disabled selected>Select Category (Student/Farmer etc.)*</option>
        <option value="student">Student</option>
        <option value="farmer">Farmer</option>
        <option value="senior_citizen">Senior Citizen</option>
        <option value="entrepreneur">Entrepreneur</option>
      </select>

      <select name="employmentStatus" class="input-field" required>
        <option value="" disabled selected>Employment Status*</option>
        <option value="working">Working</option>
        <option value="unemployed">Unemployed</option>
      </select>

      <select name="casteCategory" class="input-field" required>
        <option value="" disabled selected>Caste Category*</option>
        <option value="general">General</option>
        <option value="obc">OBC</option>
        <option value="sc">SC</option>
        <option value="st">ST</option>
      </select>

      <input
        type="email"
        name="email"
        class="input-field"
        placeholder="Email*"
        required
      >

      <input
        type="password"
        name="password"
        class="input-field"
        placeholder="Password*"
        minlength="6"
        required
      >

      <label class="terms-row">
        <input type="checkbox" required>
        <span>I consent to terms of use.</span>
      </label>

      <button type="submit" class="submit-btn">
        Create Account
      </button>

      <p id="signup-message" class="signup-message"></p>
    </form>

    <p class="bottom-link">
      Already have an account?
      <a href="/signinform.html">Sign in to an existing account</a>
    </p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
